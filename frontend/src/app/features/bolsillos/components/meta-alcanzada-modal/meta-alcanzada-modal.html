<dialog #dialogo class="modal" (click)="onBackdropClick($event)" (close)="cerrar.emit()">
  <div class="modal__confeti" aria-hidden="true">
    @for (pieza of piezas; track pieza.indice) {
      <span
        class="modal__confeti-pieza"
        [style.--color]="pieza.color"
        [style.--i]="pieza.indice"
      ></span>
    }
  </div>

  <h2 class="modal__titulo">¡Meta alcanzada!</h2>
  <p class="modal__texto">
    Lograste completar el bolsillo <strong>{{ bolsillo().nombre }}</strong> con
    <strong>$ {{ bolsillo().acumulado | number }}</strong>. ¡Felicitaciones! 🎯
  </p>
  <button class="modal__btn" (click)="cerrarDialogo()">Cerrar</button>
</dialog>
