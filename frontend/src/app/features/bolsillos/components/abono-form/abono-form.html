<form [formGroup]="form" (ngSubmit)="submit()" class="abono-form">
  <input
    type="number"
    min="1"
    step="0.01"
    formControlName="monto"
    placeholder="Monto a abonar"
    aria-label="Monto a abonar"
  />
  <button type="submit" [disabled]="form.invalid || disabled()" class="abono-form__btn">Abonar</button>
  @if (errorServidor(); as mensaje) {
    <p class="abono-form__error" role="alert">{{ mensaje }}</p>
  }
</form>
