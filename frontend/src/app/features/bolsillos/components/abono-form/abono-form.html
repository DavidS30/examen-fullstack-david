<form [formGroup]="form" (ngSubmit)="submit()" class="abono-form">
  <div class="abono-form__fila">
    <label class="visually-hidden" [for]="campoId">Monto a abonar</label>
    <input
      [id]="campoId"
      type="number"
      min="1"
      step="0.01"
      formControlName="monto"
      placeholder="Monto a abonar"
      [attr.aria-invalid]="form.controls.monto.invalid && form.controls.monto.touched"
      aria-describedby="abono-error"
    />
    <button type="submit" [disabled]="form.invalid || disabled()" class="abono-form__btn">
      Abonar
    </button>
  </div>
  @if (errorServidor(); as mensaje) {
    <p id="abono-error" class="abono-form__error" role="alert">{{ mensaje }}</p>
  }
</form>
